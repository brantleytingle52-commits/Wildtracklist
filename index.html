<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WILD</title>

  <style>
    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:radial-gradient(
        circle at top,
        #2b0507 0%,
        #100102 35%,
        #000 75%
      );
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
    }

    .page{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:40px 14px;
    }

    .tracklist-section{
      width:min(900px,100%);
      padding:40px 22px;
      background:rgba(0,0,0,.72);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 0 45px rgba(0,0,0,.75);
    }

    .wild-label{
      margin:0 0 8px;
      text-align:center;
      color:#d81f26;
      font-size:13px;
      font-weight:bold;
      letter-spacing:8px;
    }

    h1{
      margin:0 0 38px;
      text-align:center;
      font-size:clamp(42px,9vw,80px);
      letter-spacing:5px;
    }

    .tracklist{
      border-top:1px solid rgba(255,255,255,.2);
    }

    .track{
      min-height:74px;
      padding:16px 10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      border-bottom:1px solid rgba(255,255,255,.18);
    }

    .revealed-track{
      background:linear-gradient(
        90deg,
        rgba(145,0,0,.3),
        transparent
      );
    }

    .track-name{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:17px;
      font-weight:bold;
      letter-spacing:2px;
    }

    .track-number{
      color:#999;
      font-size:13px;
    }

    .track-status{
      min-width:230px;
      text-align:right;
    }

    .listen-now{
      display:inline-block;
      padding:11px 17px;
      border:1px solid #ff343b;
      color:#ff343b;
      text-decoration:none;
      font-size:12px;
      font-weight:bold;
      letter-spacing:3px;
      text-shadow:0 0 14px rgba(255,0,0,.9);
      box-shadow:0 0 12px rgba(255,0,0,.22);
      transition:.2s ease;
    }

    .listen-now:hover{
      background:#ff343b;
      color:#fff;
      box-shadow:0 0 20px rgba(255,0,0,.65);
    }

    .listen-now:active{
      transform:scale(.96);
    }

    .hidden-track{
      min-height:105px;
      padding:22px 10px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:9px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,.18);
      background:linear-gradient(
        90deg,
        rgba(145,0,0,.18),
        rgba(0,0,0,.25),
        rgba(145,0,0,.18)
      );
    }

    .hidden-track-label{
      color:#999;
      font-size:11px;
      font-weight:bold;
      letter-spacing:4px;
    }

    .hidden-title{
      font-size:25px;
      font-weight:bold;
      letter-spacing:8px;
      filter:blur(1.5px);
      text-shadow:0 0 12px rgba(255,255,255,.45);
    }

    .next-reveal{
      margin-top:48px;
      padding-top:32px;
      border-top:1px solid rgba(255,255,255,.18);
      text-align:center;
    }

    .next-reveal p{
      margin:0 0 14px;
      color:#aaa;
      font-size:10px;
      font-weight:bold;
      letter-spacing:3px;
      line-height:1.6;
    }

    .to-be-determined{
      margin:0;
      font-size:22px;
      font-weight:bold;
      letter-spacing:4px;
      color:#fff;
      text-shadow:0 0 12px rgba(255,0,0,.75);
    }

    @media(max-width:620px){

      .track{
        align-items:center;
      }

      .track-name{
        font-size:13px;
        gap:8px;
      }

      .track-status{
        min-width:145px;
      }

      .listen-now{
        padding:9px 11px;
        font-size:9px;
        letter-spacing:2px;
      }

      .hidden-title{
        font-size:21px;
      }

    }
  </style>
</head>

<body>

  <div class="page">

    <section class="tracklist-section">

      <p class="wild-label">
        TRACKLIST
      </p>

      <h1>
        WILD
      </h1>


      <div class="tracklist">


        <!-- TRACK 1 -->

        <div class="track revealed-track">

          <div class="track-name">

            <span class="track-number">
              01
            </span>

            <span>
              OUT THE CAGE
            </span>

          </div>

          <div class="track-status">

            <a
              class="listen-now"
              href="https://music.apple.com/us/album/out-the-cage-single/6793642115"
              target="_blank"
              rel="noopener noreferrer"
            >
              LISTEN NOW
            </a>

          </div>

        </div>


        <!-- TRACK 2 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            02 TRACK 2
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>


        <!-- TRACK 3 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            03 TRACK 3
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>


        <!-- TRACK 4 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            04 TRACK 4
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>


        <!-- TRACK 5 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            05 TRACK 5
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>


        <!-- TRACK 6 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            06 TRACK 6
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>


        <!-- TRACK 7 -->

        <div class="hidden-track">

          <div class="hidden-track-label">
            07 TRACK 7
          </div>

          <div class="hidden-title">
            ********
          </div>

        </div>

      </div>


      <!-- NEXT REVEAL -->

      <section class="next-reveal">

        <p>
          WHEN WILL THE NEXT TRACK BE REVEALED?
        </p>

        <div class="to-be-determined">
          TO BE DETERMINED
        </div>

      </section>

    </section>

  </div>

</body>
</html>
